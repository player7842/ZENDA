# =====================================================================
# ZENDA — Orquestación local con Docker Compose
# Uso:   cp .env.example .env   (y edita los valores)
#        docker compose up --build
# Web:   http://localhost:8080      API: http://localhost:4000/api/health
# =====================================================================
name: zenda

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta SOLO la primera vez (con el volumen vacío)
      - ./Database/zenda_bd.sql:/docker-entrypoint-initdb.d/01-zenda_bd.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicialización Postgres solo
      # escucha por socket Unix y el healthcheck no debe darse por bueno
      # antes de que termine de cargar zenda_bd.sql.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica la migración incremental sobre una base ya existente. En una base
  # nueva, zenda_bd.sql ya incluye el esquema y esta migración no hace nada.
  migrate:
    image: postgres:16-alpine
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./Database/migrations:/migrations:ro
    entrypoint: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/migrations/002_semana2.sql']

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: 'false'
      DB_SSL_REJECT_UNAUTHORIZED: 'false'
      JWT_SECRET: ${JWT_SECRET}
      JWT_SESSION_EXPIRES: ${JWT_SESSION_EXPIRES:-24h}
      CODIGO_PROGRAMA_COORDINADOR: ${CODIGO_PROGRAMA_COORDINADOR:-2338}
      # Origen(es) del frontend separados por coma para CORS y para el
      # enlace de recuperación de contraseña.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'
    healthcheck:
      # 127.0.0.1 fuerza IPv4: dentro del contenedor "localhost" resuelve a
      # ::1 y Nginx escucha en IPv4, así que el healthcheck fallaba aunque la
      # web respondiera.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
