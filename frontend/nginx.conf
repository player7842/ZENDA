# =====================================================================
# ZENDA — Configuración de Nginx para servir el frontend compilado
# =====================================================================
# El build de Vite genera una SPA: todas las rutas que no sean un archivo
# real deben devolver index.html para que React Router las resuelva.
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los recursos de texto
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas (RNF-001)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los archivos con hash de Vite pueden cachearse de forma agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html nunca debe cachearse para no servir versiones viejas
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
