name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (lint + pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zenda_user
          POSTGRES_PASSWORD: zenda_ci
          POSTGRES_DB: zenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U zenda_user -d zenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 4000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: zenda_user
      DB_PASSWORD: zenda_ci
      DB_NAME: zenda
      DB_SSL: 'false'
      JWT_SECRET: secreto_de_ci_suficientemente_largo_para_pruebas
      FRONTEND_URL: http://localhost:5173
      EMAIL_USER: ''
      EMAIL_PASS: ''
      JWT_SESSION_EXPIRES: 24h
      CODIGO_PROGRAMA_COORDINADOR: 2338
      # En CI la base siempre debe existir: si no, las pruebas de integración
      # fallan en vez de omitirse silenciosamente.
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: backend
        run: pnpm lint

      - name: Cargar esquema y datos de prueba
        env:
          PGPASSWORD: zenda_ci
        run: psql -h localhost -U zenda_user -d zenda -v ON_ERROR_STOP=1 -f Database/zenda_bd.sql

      - name: Probar migración idempotente
        env:
          PGPASSWORD: zenda_ci
        run: |
          psql -h localhost -U zenda_user -d zenda -v ON_ERROR_STOP=1 -f Database/migrations/002_semana2.sql
          psql -h localhost -U zenda_user -d zenda -v ON_ERROR_STOP=1 -f Database/migrations/002_semana2.sql
          psql -h localhost -U zenda_user -d zenda -v ON_ERROR_STOP=1 -f Database/migrations/003_cierre.sql
          psql -h localhost -U zenda_user -d zenda -v ON_ERROR_STOP=1 -f Database/migrations/003_cierre.sql

      - name: Probar migración desde esquema v11
        env:
          PGPASSWORD: zenda_ci
        run: |
          psql -h localhost -U zenda_user -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS zenda_v11;'
          psql -h localhost -U zenda_user -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zenda_v11;'
          psql -h localhost -U zenda_user -d zenda_v11 -v ON_ERROR_STOP=1 -f Database/fixtures/v11_migracion.sql
          psql -h localhost -U zenda_user -d zenda_v11 -v ON_ERROR_STOP=1 -f Database/migrations/002_semana2.sql
          psql -h localhost -U zenda_user -d zenda_v11 -v ON_ERROR_STOP=1 -f Database/migrations/002_semana2.sql
          psql -h localhost -U zenda_user -d zenda_v11 -v ON_ERROR_STOP=1 -f Database/migrations/003_cierre.sql
          psql -h localhost -U zenda_user -d zenda_v11 -v ON_ERROR_STOP=1 -f Database/migrations/003_cierre.sql
          psql -h localhost -U zenda_user -d zenda_v11 -v ON_ERROR_STOP=1 -f Database/fixtures/v11_migracion_assert.sql

      - name: Formato (Prettier)
        run: pnpm dlx prettier --check "backend/src/**/*.{js,mjs,cjs}" "frontend/src/**/*.{jsx,js}" "*.{md,json,yml,yaml}"

      - name: Pruebas
        working-directory: backend
        run: pnpm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:4000
