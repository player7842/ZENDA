# =====================================================================
# ZENDA — Blueprint de Render para el backend (API Express)
# ---------------------------------------------------------------------
# Despliega el backend desde el Dockerfile del repositorio.
# La base de datos vive en Neon (PostgreSQL) y se conecta con DATABASE_URL.
# Los valores marcados con "sync: false" se cargan a mano en el panel.
# =====================================================================
services:
  - type: web
    name: zenda-api
    runtime: docker
    plan: free
    region: oregon
    # El contexto es la raíz para incluir Database/migrations en la imagen.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    # El plan free no admite `preDeployCommand` (solo planes pagos). La
    # migración se ejecuta al arrancar el contenedor: es idempotente y, si
    # PostgreSQL la rechaza, el proceso termina con código distinto de cero y
    # Render no marca el despliegue como saludable.
    startCommand: sh -c "node scripts/migrar.js && node server.js"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_SSL
        value: "true"
      # Neon usa certificados válidos; no desactivar esta validación.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      # Cadena de conexión de Neon, por ejemplo:
      # postgresql://usuario:clave@ep-xxx.us-east-2.aws.neon.tech/zenda?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Sesión actual de 24 h (HU-004 la reducirá a 15 min + refresh).
      - key: JWT_SESSION_EXPIRES
        value: 24h
      - key: CODIGO_PROGRAMA_COORDINADOR
        value: "2338"
      # Dominio público del frontend en Vercel. Si hay varios, séparalos con coma.
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
